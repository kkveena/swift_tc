# SWIFT Address Extraction — Phase 1 runtime configuration.
#
# This is the file the pipeline actually loads (override with
# SWIFT_ADDRESS_CONFIG). It is a superset of `config.example.yaml`; every key
# added beyond the example is marked "[EXTENSION]" with the reason.
#
# No secrets belong in this file. Credentials come from environment variables
# only (see `.env.example`).

project:
  prompt_version: "v6-lima-postal-inference"
  record_id_column: "RECORD_ID"
  # [EXTENSION] Path to the Gemini prompt contract. Loaded from exactly one
  # place so the prompt is never duplicated across modules.
  prompt_path: "prompts/GEMINI_EXTRACTION_PROMPT.md"
  # [EXTENSION] Group configuration file (CSV or YAML).
  group_config_path: "config/group_config.csv"

input:
  preserve_all_columns: true
  zero_field_is_missing: true

output:
  naming_style: "canonical"       # "canonical" | "legacy" — never both at once
  country_candidate_separator: ","
  country_candidate_sort: "alphabetical"
  templates:
    combined_address: "combined_address_group_{id}"
    combined_address_cleaned: "combined_address_cleaned_group_{id}"
    predicted_town: "predicted_town_group_{id}"
    predicted_country: "predicted_country_group_{id}"
    # Deterministic expansion of predicted_country via the ISO reference layer.
    # Never a second model prediction. Stays aligned element-for-element with
    # predicted_country, including for comma-separated ambiguous candidate sets.
    predicted_country_name: "predicted_country_name_group_{id}"
    predicted_town_probability: "predicted_town_probability_group_{id}"
    predicted_country_probability: "predicted_country_probability_group_{id}"
    predicted_town_exists: "predicted_town_exists_group_{id}"
    predicted_country_exists: "predicted_country_exists_group_{id}"
    composite_weighted_score: "composite_weighted_score_group_{id}"
    rationale_town: "rationale_town_group_{id}"
    rationale_country: "rationale_country_group_{id}"
    # Ground-truth correctness labels. NULLABLE booleans: blank means "no
    # independent evidence", which is NOT the same as False. Distinct from
    # predicted_*_exists, which means "explicitly present in the input text".
    town_exists_ok: "town_exists_ok_group_{id}"
    country_exists_ok: "country_exists_ok_group_{id}"
    # Binary cross-entropy of model confidence against those labels. Blank when
    # no ground truth is available. LOWER is better — the opposite direction to
    # composite_weighted_score.
    cross_entropy: "cross_entropy_group_{id}"
    # Deterministic Python retraction of Town/Country evidence that was actually
    # verified in the source text. Never a second model call.
    combined_address_retracted: "combined_address_retracted_group_{id}"
    combined_address_retracted_comments: "combined_address_retracted_group_comments_{id}"
    # Explicit HITL routing decision. HITL = Human-in-the-Loop. Deterministic
    # Python policy: Gemini never chooses the state or writes the reason.
    hitl_flag: "HITL_flag_group_{id}"
    hitl_state: "HITL_state_group_{id}"
    hitl_state_reason: "HITL_state_reason_group_{id}"
  # [EXTENSION] Legacy aliases reproduce the original (typo'd) field names from
  # the source screenshots. Selected by naming_style: "legacy". Exactly one
  # naming set is ever emitted — the two sets are never produced together.
  legacy_templates:
    combined_address: "comined_address_group_{id}"
    combined_address_cleaned: "comined_address_cleaned_group_{id}"
    predicted_town: "predicted_town_group_{id}"
    predicted_country: "predicted_countrty_group_{id}"
    predicted_country_name: "predicted_countrty_name_group_{id}"
    predicted_town_probability: "predicted_town_probability_group_{id}"
    predicted_country_probability: "predicted_countrty_probability_group_{id}"
    predicted_town_exists: "predicted_town_exists_group_{id}"
    predicted_country_exists: "predicted_countrty_exists_group_{id}"
    composite_weighted_score: "composite_weighted_score_group_{id}"
    rationale_town: "rational_town_group_{id}"
    rationale_country: "rational_countrty_group_{id}"
    town_exists_ok: "town_exists_ok_group_{id}"
    country_exists_ok: "countrty_exists_ok_group_{id}"
    cross_entropy: "cross_entropy_group_{id}"
    combined_address_retracted: "comined_address_retracted_group_{id}"
    combined_address_retracted_comments: "comined_address_retracted_group_comments_{id}"
    hitl_flag: "HITL_flag_group_{id}"
    hitl_state: "HITL_state_group_{id}"
    hitl_state_reason: "HITL_state_reason_group_{id}"

model:
  model_env_var: "GEMINI_MODEL"
  default_model: "gemini-3.5-flash"
  temperature: 0.0
  max_output_tokens: 700
  concurrency: 4
  max_retries: 5
  request_timeout_seconds: 60
  checkpoint_every_unique_addresses: 100
  # [EXTENSION] Bounded exponential backoff with jitter for transient failures.
  retry_initial_seconds: 1.0
  retry_max_seconds: 30.0
  retry_jitter_seconds: 0.5
  # [EXTENSION] Max simultaneous in-flight requests. Kept separate from
  # `concurrency` (worker count) so a shared quota can be throttled
  # independently of thread-pool sizing.
  max_in_flight_requests: 4
  # [EXTENSION] Public web-search grounding is OFF by default and must stay off
  # for customer/payment address data unless data governance approves it.
  enable_google_search_grounding: false

processing:
  deduplicate_addresses: true
  cache_enabled: true
  cache_path: "outputs/address_cache.jsonl"
  errors_path: "outputs/errors/processing_errors.csv"
  metrics_path: "outputs/run_metrics.json"
  redact_raw_address_in_logs: true
  # [EXTENSION] Default destination for the expanded output CSV.
  output_path: "outputs/phase1_output.csv"
  # [EXTENSION] Nested per-record detail. The CSV stays the flat compatibility
  # artifact; audit and evaluation depth lives here instead of growing dozens
  # more columns. JSON Lines by default so large runs stream one record at a
  # time rather than building one huge in-memory array. Contains raw address
  # data — treat as sensitive; outputs/ is git-ignored.
  detailed_json_enabled: true
  detailed_json_path: "outputs/phase1_detailed_output.jsonl"
  detailed_json_format: "jsonl"     # "jsonl" (default) | "json" (small dev runs)
  detailed_json_include_empty_groups: true

reference_data:
  provider: "iso3166"             # "null" | "iso3166" | "composite"
  iso3166_path: "data/reference/iso3166.csv"
  swiftref_enabled: false
  # [EXTENSION] Bumped whenever the reference corpus changes. Participates in
  # the cache key so a reference-data change invalidates stale extractions.
  reference_context_version: "iso3166-2026-08"
  # [EXTENSION] Two-letter ISO codes that collide with ordinary English or
  # address vocabulary. When the predicted country's alpha-2 code is in this
  # list, a bare token match is NOT accepted as explicit evidence unless the
  # token is in trailing country position; otherwise a country-name alias must
  # match. This blocks "SUITE 5 IN TOWER" from "proving" country IN.
  ambiguous_alpha2_tokens:
    ["AM", "AS", "AT", "BE", "BY", "DO", "IN", "IS", "IT", "ME", "MS",
     "NO", "ON", "OR", "SH", "SO", "TO", "AN", "LA", "AL", "MA", "SA"]
  # [EXTENSION] How many trailing tokens still count as "country position".
  # 2 covers the real trailing forms ("... AUCKLAND 1140 NZ", "... NZ 1140")
  # while excluding a mid-address collision: in "BOSTON MA 02111 US", the US
  # state abbreviation MA must not be read as evidence of Morocco.
  trailing_country_token_window: 2

  # --- Town/Country development reference ---------------------------------
  # An EXTERNAL RUNTIME DEPENDENCY, not part of this package. The file is large
  # (~38 MB) and environment-specific: it is git-ignored, never bundled, and
  # never embedded. `town_country_path` is resolved against the model root
  # (`models/swft_tc/`) when relative, so an enterprise deployment repoints it
  # at an approved managed source through configuration alone.
  #
  # Build a development copy with:
  #   python scripts/swft_tc/build_geonames_town_country_reference.py \
  #     --output models/swft_tc/data/reference/town_country_reference.csv
  # GeoNames data is CC BY 4.0 — preserve attribution.
  town_country_enabled: true
  town_country_path: "data/reference/town_country_reference.csv"
  town_country_source: "development_local_reference"
  town_country_approved_for_production: false
  # Physical -> logical column mapping for a file whose headers differ from the
  # expected schema. Empty means the expected names are used as-is.
  # e.g. {city: town_name, iso2: country_code}
  town_country_column_map: {}
  # 0 = unlimited. A positive value caps how many candidate codes reach the CSV
  # when reference ambiguity is escalated; the full set always stays in audit.
  town_country_max_candidates: 0
  # How a town name that maps to several countries affects the result:
  #   escalate - preserve every candidate, force country probability/weight and
  #              the composite score to 0.0, and mandate HITL.
  #   annotate - leave the prediction untouched and record the reference finding
  #              in the audit trail and metrics only.
  # Production runs use annotate: the development reference is corroborative
  # evidence, not an override of a defensible model inference from the address.
  town_country_ambiguity_policy: "annotate"

reporting:
  enabled: true
  reports_dir: "outputs/reports"
  charts_dir: "outputs/charts"
  executive_summary_filename: "executive_summary.json"
  score_distribution_filename: "score_distribution.csv"
  threshold_sensitivity_filename: "threshold_sensitivity.csv"
  scenario_distribution_filename: "scenario_distribution.csv"
  # Calibration summary over grounded observations only. LOWER is better —
  # the opposite direction to composite_weighted_score.
  cross_entropy_summary_filename: "cross_entropy_summary.csv"
  # Distribution of the primary HITL routing state over non-empty instances.
  hitl_state_distribution_filename: "hitl_state_distribution.csv"
  histogram_filename: "composite_score_histogram.png"

  # --- Threshold analytics (decision support only) -------------------------
  # These artifacts inform a threshold conversation; they never set one. The
  # operational cutoff is `scoring.hitl_threshold` below and is changed only by
  # an approved configuration change, never by the shape of a curve.
  #
  # threshold_tradeoff   auto-accept vs review workload across the whole grid.
  #                      Workload only — it says nothing about correctness, so
  #                      an elbow in it is not evidence for a production cutoff.
  # precision_coverage   auto-accept precision vs coverage over observations
  #                      with BOTH Town and Country independently labelled.
  #                      This is the curve a production cutoff is argued from.
  # error_capture_*      if review works lowest-score-first, how fast does it
  #                      reach the cases that are actually wrong (gain), and
  #                      how many times better than random is that (lift).
  threshold_tradeoff_filename: "threshold_tradeoff.csv"
  threshold_tradeoff_chart_filename: "threshold_tradeoff.png"
  precision_coverage_filename: "precision_coverage.csv"
  precision_coverage_chart_filename: "precision_coverage.png"
  error_capture_gain_filename: "error_capture_gain.csv"
  error_capture_gain_chart_filename: "error_capture_gain.png"
  error_capture_lift_filename: "error_capture_lift.csv"
  error_capture_lift_chart_filename: "error_capture_lift.png"
  # Grid resolution for the trade-off and precision/coverage curves. Must
  # satisfy 0 < step <= 1.
  threshold_curve_step: 0.01
  # Labelled observations required before the label-dependent analyses are
  # produced at all. Below these the report states that the analysis is
  # unavailable and why, rather than drawing a chart the data cannot support.
  min_grounded_for_precision: 1
  min_errors_for_gain: 1
  # Lower edges of the score bands. Each band is [edge, next_edge); the last is
  # closed at 1.0. Scores below the first edge fall into the "< 0.60" band.
  score_band_edges: [0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  sensitivity_thresholds: [0.80, 0.85, 0.90, 0.95]
  # Provisional conservative starting point for Phase 1 routing. NOT calibrated
  # accuracy: replace with the lowest threshold meeting the business-approved
  # minimum precision once labeled validation data exists.
  recommended_threshold: 0.90

scoring:
  mode: "composite_weighted"
  hitl_threshold: 0.80            # placeholder — calibrate against labeled data
  ambiguous_country_probability_override: 0.00
  force_ambiguous_country_to_hitl: true
  rules:
    both_explicit:
      town_weight: 1.00
      country_weight: 1.00
    country_explicit_town_inferred:
      town_weight: 0.50
      country_weight: 1.00
    town_explicit_country_inferred:
      town_weight: 0.75
      country_weight: 0.50
    town_explicit_country_ambiguous:
      town_weight: 0.50
      country_weight: 0.00
    neither_explicit_both_inferred:
      town_weight: 0.20
      country_weight: 0.20
    no_defensible_prediction:
      town_weight: 0.00
      country_weight: 0.00
    # [EXTENSION] The six scenarios above (SCORING_SPEC.md) have no row for
    # "country ambiguous AND town not explicit". Rather than silently reusing
    # `town_explicit_country_ambiguous` (whose 0.50 town weight asserts an
    # explicitness that was not verified), this documented scenario is used.
    # The composite score is 0.0 either way because the ambiguity override
    # forces country probability to 0.0; the distinct name keeps the audit
    # trail honest about why.
    town_inferred_country_ambiguous:
      town_weight: 0.20
      country_weight: 0.00
