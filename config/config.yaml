# SWIFT Address Extraction — Phase 1 runtime configuration.
#
# This is the file the pipeline actually loads (override with
# SWIFT_ADDRESS_CONFIG). It is a superset of `config.example.yaml`; every key
# added beyond the example is marked "[EXTENSION]" with the reason.
#
# No secrets belong in this file. Credentials come from environment variables
# only (see `.env.example`).

project:
  prompt_version: "v2-composite-weighted"
  record_id_column: "RECORD_ID"
  # [EXTENSION] Path to the Gemini prompt contract. Loaded from exactly one
  # place so the prompt is never duplicated across modules.
  prompt_path: "prompts/GEMINI_EXTRACTION_PROMPT.md"
  # [EXTENSION] Group configuration file (CSV or YAML).
  group_config_path: "config/group_config.csv"

input:
  preserve_all_columns: true
  zero_field_is_missing: true

output:
  naming_style: "canonical"       # "canonical" | "legacy" — never both at once
  country_candidate_separator: ","
  country_candidate_sort: "alphabetical"
  templates:
    combined_address: "combined_address_group_{id}"
    combined_address_cleaned: "combined_address_cleaned_group_{id}"
    predicted_town: "predicted_town_group_{id}"
    predicted_country: "predicted_country_group_{id}"
    predicted_town_probability: "predicted_town_probability_group_{id}"
    predicted_country_probability: "predicted_country_probability_group_{id}"
    predicted_town_exists: "predicted_town_exists_group_{id}"
    predicted_country_exists: "predicted_country_exists_group_{id}"
    composite_weighted_score: "composite_weighted_score_group_{id}"
    rationale_town: "rationale_town_group_{id}"
    rationale_country: "rationale_country_group_{id}"
  # [EXTENSION] Legacy aliases reproduce the original (typo'd) field names from
  # the source screenshots. Selected by naming_style: "legacy". Exactly one
  # naming set is ever emitted — the two sets are never produced together.
  legacy_templates:
    combined_address: "comined_address_group_{id}"
    combined_address_cleaned: "comined_address_cleaned_group_{id}"
    predicted_town: "predicted_town_group_{id}"
    predicted_country: "predicted_countrty_group_{id}"
    predicted_town_probability: "predicted_town_probability_group_{id}"
    predicted_country_probability: "predicted_countrty_probability_group_{id}"
    predicted_town_exists: "predicted_town_exists_group_{id}"
    predicted_country_exists: "predicted_countrty_exists_group_{id}"
    composite_weighted_score: "composite_weighted_score_group_{id}"
    rationale_town: "rational_town_group_{id}"
    rationale_country: "rational_countrty_group_{id}"

model:
  model_env_var: "GEMINI_MODEL"
  default_model: "gemini-3.5-flash"
  temperature: 0.0
  max_output_tokens: 700
  concurrency: 4
  max_retries: 5
  request_timeout_seconds: 60
  checkpoint_every_unique_addresses: 100
  # [EXTENSION] Bounded exponential backoff with jitter for transient failures.
  retry_initial_seconds: 1.0
  retry_max_seconds: 30.0
  retry_jitter_seconds: 0.5
  # [EXTENSION] Max simultaneous in-flight requests. Kept separate from
  # `concurrency` (worker count) so a shared quota can be throttled
  # independently of thread-pool sizing.
  max_in_flight_requests: 4
  # [EXTENSION] Public web-search grounding is OFF by default and must stay off
  # for customer/payment address data unless data governance approves it.
  enable_google_search_grounding: false

processing:
  deduplicate_addresses: true
  cache_enabled: true
  cache_path: "outputs/address_cache.jsonl"
  errors_path: "outputs/processing_errors.csv"
  metrics_path: "outputs/run_metrics.json"
  redact_raw_address_in_logs: true
  # [EXTENSION] Default destination for the expanded output CSV.
  output_path: "outputs/phase1_output.csv"

reference_data:
  provider: "iso3166"             # "null" | "iso3166" | "composite"
  iso3166_path: "data/reference/iso3166.csv"
  swiftref_enabled: false
  # [EXTENSION] Bumped whenever the reference corpus changes. Participates in
  # the cache key so a reference-data change invalidates stale extractions.
  reference_context_version: "iso3166-2026-08"
  # [EXTENSION] Two-letter ISO codes that collide with ordinary English or
  # address vocabulary. When the predicted country's alpha-2 code is in this
  # list, a bare token match is NOT accepted as explicit evidence unless the
  # token is in trailing country position; otherwise a country-name alias must
  # match. This blocks "SUITE 5 IN TOWER" from "proving" country IN.
  ambiguous_alpha2_tokens:
    ["AM", "AS", "AT", "BE", "BY", "DO", "IN", "IS", "IT", "ME", "MS",
     "NO", "ON", "OR", "SH", "SO", "TO", "AN", "LA", "AL", "MA", "SA"]
  # [EXTENSION] How many trailing tokens still count as "country position".
  # 2 covers the real trailing forms ("... AUCKLAND 1140 NZ", "... NZ 1140")
  # while excluding a mid-address collision: in "BOSTON MA 02111 US", the US
  # state abbreviation MA must not be read as evidence of Morocco.
  trailing_country_token_window: 2

scoring:
  mode: "composite_weighted"
  hitl_threshold: 0.80            # placeholder — calibrate against labeled data
  ambiguous_country_probability_override: 0.00
  force_ambiguous_country_to_hitl: true
  rules:
    both_explicit:
      town_weight: 1.00
      country_weight: 1.00
    country_explicit_town_inferred:
      town_weight: 0.50
      country_weight: 1.00
    town_explicit_country_inferred:
      town_weight: 0.75
      country_weight: 0.50
    town_explicit_country_ambiguous:
      town_weight: 0.50
      country_weight: 0.00
    neither_explicit_both_inferred:
      town_weight: 0.20
      country_weight: 0.20
    no_defensible_prediction:
      town_weight: 0.00
      country_weight: 0.00
    # [EXTENSION] The six scenarios above (SCORING_SPEC.md) have no row for
    # "country ambiguous AND town not explicit". Rather than silently reusing
    # `town_explicit_country_ambiguous` (whose 0.50 town weight asserts an
    # explicitness that was not verified), this documented scenario is used.
    # The composite score is 0.0 either way because the ambiguity override
    # forces country probability to 0.0; the distinct name keeps the audit
    # trail honest about why.
    town_inferred_country_ambiguous:
      town_weight: 0.20
      country_weight: 0.00
